<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Chapter - Webnovel Library</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --text-color: #e4e4e7;
      --border-color: #27272a;
      --accent: #6366f1;
      --patreon: #FF424D;
      --kofi: #29A8DF;
      --font-size: 19px;
      --line-height: 1.8;
      --content-width: 760px;
    }

    body.light-theme {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
      --border-color: #e9ecef;
    }

    body.sepia-theme {
      --bg-color: #f4ecd8;
      --card-bg: #fbf0d9;
      --text-color: #5b4636;
      --border-color: #e2d7be;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: Georgia, serif;
      transition: background-color 0.2s, color 0.2s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    a { color: inherit; text-decoration: none; }

    /* Control Header */
    .reader-header {
      position: sticky;
      top: 0;
      width: 100%;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      z-index: 100;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .nav-back { font-weight: 600; font-size: 0.9rem; color: var(--accent); }
    .controls { display: flex; gap: 0.5rem; align-items: center; }

    .btn-ctrl {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .btn-ctrl:hover { border-color: var(--accent); }

    /* Reader Container */
    .reader-container {
      max-width: var(--content-width);
      width: 90%;
      margin: 2.5rem auto;
      font-size: var(--font-size);
      line-height: var(--line-height);
    }

    .chapter-title {
      font-size: 2em;
      text-align: center;
      margin-bottom: 1rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .meta-bar {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-color);
      opacity: 0.7;
      margin-bottom: 2.5rem;
      font-family: -apple-system, sans-serif;
    }

    .paragraph {
      margin-bottom: 1.6em;
      text-align: justify;
    }

    /* Support Call to Action */
    .support-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      margin: 3.5rem 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .support-card h3 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    .support-card p { font-size: 0.95rem; opacity: 0.8; margin-bottom: 1.5rem; }
    .cta-buttons { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn-patreon { background: var(--patreon); color: white; padding: 0.65rem 1.4rem; border-radius: 6px; font-weight: 700; font-size: 0.9rem; }
    .btn-kofi { background: var(--kofi); color: white; padding: 0.65rem 1.4rem; border-radius: 6px; font-weight: 700; font-size: 0.9rem; }

    /* Navigation Bar */
    .ch-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: var(--content-width);
      margin-bottom: 4rem;
      gap: 1rem;
      font-family: -apple-system, sans-serif;
    }

    .btn-nav {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .btn-nav:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-nav:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Error Message */
    .error-msg { text-align: center; padding: 3rem; font-family: -apple-system, sans-serif; }
  </style>
</head>
<body>

  <header class="reader-header">
    <div class="header-inner">
      <a href="#" id="toc-link" class="nav-back">← Novel Details</a>
      <div class="controls">
        <button class="btn-ctrl" onclick="adjustFont(-1)">A-</button>
        <button class="btn-ctrl" onclick="adjustFont(1)">A+</button>
        <button class="btn-ctrl" onclick="setTheme('dark')">🌙</button>
        <button class="btn-ctrl" onclick="setTheme('light')">☀️</button>
        <button class="btn-ctrl" onclick="setTheme('sepia')">📜</button>
      </div>
    </div>
  </header>

  <main class="reader-container">
    <h1 class="chapter-title" id="ch-title">Loading Chapter...</h1>
    <div class="meta-bar" id="ch-meta"></div>

    <div id="ch-content"></div>

    <!-- Patron & Ko-fi CTA inside Reader -->
    <div class="support-card">
      <h3>Enjoying the story?</h3>
      <p>Read advanced chapters ahead of time on Patreon, or throw a tip in the tip jar via Ko-fi!</p>
      <div class="cta-buttons">
        <a href="https://patreon.com/yourname" target="_blank" class="btn-patreon">Read Ahead on Patreon</a>
        <a href="https://ko-fi.com/yourname" target="_blank" class="btn-kofi">Support on Ko-fi</a>
      </div>
    </div>

    <!-- Chapter Navigation -->
    <div class="ch-nav">
      <button class="btn-nav" id="prev-btn" onclick="navigateChapter(-1)">← Previous</button>
      <a href="#" id="bottom-toc" class="btn-nav">Table of Contents</a>
      <button class="btn-nav" id="next-btn" onclick="navigateChapter(1)">Next →</button>
    </div>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const novelId = urlParams.get('novel');
    let currentCh = parseInt(urlParams.get('ch')) || 1;

    let fontSize = parseInt(localStorage.getItem('reader_font')) || 19;
    let theme = localStorage.getItem('reader_theme') || 'dark';

    function applySettings() {
      document.documentElement.style.setProperty('--font-size', `${fontSize}px`);
      document.body.className = `${theme}-theme`;
    }

    function adjustFont(delta) {
      fontSize = Math.min(Math.max(fontSize + delta, 14), 28);
      document.documentElement.style.setProperty('--font-size', `${fontSize}px`);
      localStorage.setItem('reader_font', fontSize);
    }

    function setTheme(newTheme) {
      theme = newTheme;
      document.body.className = `${theme}-theme`;
      localStorage.setItem('reader_theme', theme);
    }

    async function loadChapter() {
      if (!novelId) {
        document.getElementById('ch-content').innerHTML = "<div class='error-msg'>No novel specified.</div>";
        return;
      }

      // Update Navigation links
      document.getElementById('toc-link').href = `novel.html?id=${novelId}`;
      document.getElementById('bottom-toc').href = `novel.html?id=${novelId}`;

      const titleEl = document.getElementById('ch-title');
      const metaEl = document.getElementById('ch-meta');
      const contentEl = document.getElementById('ch-content');

      titleEl.innerText = "Loading Chapter...";
      contentEl.innerHTML = "";
      metaEl.innerText = "";

      try {
        const response = await fetch(`data/${novelId}/${currentCh}.json`);
        if (!response.ok) throw new Error("Chapter not found");

        const data = await response.json();
        titleEl.innerText = data.title || `Chapter ${currentCh}`;

        // Word count calculation
        const fullText = (data.paragraphs || []).join(' ');
        const wordCount = fullText.split(/\s+/).filter(Boolean).length;
        const readTime = Math.ceil(wordCount / 200);

        metaEl.innerText = `${wordCount} Words • ~${readTime} min read`;

        // Render Paragraphs
        contentEl.innerHTML = (data.paragraphs || []).map(p => `<p class="paragraph">${p}</p>`).join('');

        // Update URL query state without page reload
        window.history.pushState({}, '', `?novel=${novelId}&ch=${currentCh}`);

        // Save last read chapter position
        localStorage.setItem(`last_read_${novelId}`, currentCh);

        // Update Nav buttons
        document.getElementById('prev-btn').disabled = (currentCh <= 1);
        window.scrollTo({ top: 0, behavior: 'smooth' });

      } catch (err) {
        titleEl.innerText = "Chapter Not Found";
        contentEl.innerHTML = `
          <div class="error-msg">
            <p>Chapter ${currentCh} is not available yet.</p>
            <p><a href="novel.html?id=${novelId}" style="color: var(--accent); text-decoration: underline;">Return to Table of Contents</a></p>
          </div>
        `;
      }
    }

    function navigateChapter(delta) {
      currentCh += delta;
      if (currentCh < 1) currentCh = 1;
      loadChapter();
    }

    // Keyboard Shortcuts (Left / Right Arrow Keys)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' && currentCh > 1) {
        navigateChapter(-1);
      } else if (e.key === 'ArrowRight') {
        navigateChapter(1);
      }
    });

    applySettings();
    loadChapter();
  </script>
</body>
</html>
